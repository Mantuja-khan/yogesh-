<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="docShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Background Canvas Container for clean rendering -->
  <g filter="url(#docShadow)">
    <!-- Document Body with Clean Red Outline -->
    <path
      d="M120 48 L340 48 L440 148 L440 464 C440 475 431 484 420 484 L120 484 C109 484 100 475 100 464 L100 68 C100 57 109 48 120 48 Z"
      fill="#FFFFFF"
      stroke="#E5252A"
      stroke-width="16"
      stroke-linejoin="round"
    />

    <!-- Top-Right Folded Flap Corner -->
    <path
      d="M340 48 L340 148 L440 148 Z"
      fill="#F0F0F0"
      stroke="#E5252A"
      stroke-width="16"
      stroke-linejoin="round"
    />
  </g>

  <!-- Adobe Acrobat Tri-Loop Wave Vector Symbol in Red -->
  <g fill="none" stroke="#E5252A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Central Peak downward into bottom loops -->
    <path d="M270 170 C240 220 165 340 156 370 C145 402 210 395 255 300 C300 395 365 402 354 370 C345 340 270 220 270 170 Z" fill="#E5252A" fill-opacity="0.06" />
    <path d="M270 170 C238 222 165 340 156 370" />
    <path d="M270 170 C302 222 375 340 384 370" />
    <path d="M165 372 C215 285 325 285 375 372" />
  </g>

  <!-- PDF Badge Pill with High-Contrast Typography -->
  <g transform="translate(160, 395)">
    <rect x="0" y="0" width="220" height="74" rx="14" fill="#C2C2C2" />
    <text x="110" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#2B2B2B" text-anchor="middle" letter-spacing="3">PDF</text>
  </g>
</svg>
